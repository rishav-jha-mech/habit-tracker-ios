name: HabitTracker
options:
  bundleIdPrefix: com.rishavjha.larpios
  deploymentTarget:
    iOS: "17.0"

targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      - path: HabitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishavjha.larpios.habittracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: HabitTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  HabitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabitTrackerTests
    dependencies:
      - target: HabitTracker
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: all
        HabitTrackerTests: [test]
    test:
      targets:
        - HabitTrackerTests
